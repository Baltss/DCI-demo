/* ============================== LISTA DE CASOS ============================== */
function ListaCasos({casos, go, initialQuery}){
  const [q, setQ] = useState(initialQuery || "");
  const [fTipo, setFTipo] = useState("");
  const [fCategoria, setFCategoria] = useState("");
  const [fEstado, setFEstado] = useState("");
  const [fResponsable, setFResponsable] = useState("");
  const [sortKey, setSortKey] = useState("fechaIngreso");
  const [sortDir, setSortDir] = useState("desc");

  const filtered = useMemo(()=>{
    let r = casos.filter(c=>{
      if(fTipo && c.tipo!==fTipo) return false;
      if(fCategoria && c.categoria!==fCategoria) return false;
      if(fResponsable && c.responsable!==fResponsable) return false;
      if(fEstado){
        if(fEstado==="en_gestion" && c.estadoOperativo!=="en_gestion") return false;
        if(fEstado!=="en_gestion" && c.resultadoAcuerdo!==fEstado) return false;
      }
      if(q){
        const hay = (c.id+" "+(c.numeroExpediente||"")+" "+c.denunciante.nombre+" "+c.denunciante.dni+" "+(c.empresas||[]).map(e=>e.nombre).join(" ")).toLowerCase();
        if(!hay.includes(q.toLowerCase())) return false;
      }
      return true;
    });
    r.sort((a,b)=>{
      let av, bv;
      if(sortKey==="fechaIngreso"){ av=a.fechaIngreso; bv=b.fechaIngreso; }
      else if(sortKey==="denunciante"){ av=a.denunciante.nombre; bv=b.denunciante.nombre; }
      else if(sortKey==="tipo"){ av=a.tipo; bv=b.tipo; }
      else { av=a[sortKey]; bv=b[sortKey]; }
      if(av<bv) return sortDir==="asc"?-1:1;
      if(av>bv) return sortDir==="asc"?1:-1;
      return 0;
    });
    return r;
  },[casos,q,fTipo,fCategoria,fEstado,fResponsable,sortKey,sortDir]);

  function toggleSort(key){
    if(sortKey===key) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortKey(key); setSortDir("desc"); }
  }

  const activeFilters = [
    fTipo && {k:"tipo", label:TIPOS[fTipo], clear:()=>setFTipo("")},
    fCategoria && {k:"cat", label:fCategoria, clear:()=>setFCategoria("")},
    fEstado && {k:"est", label: fEstado==="en_gestion"?"En gestión":(RESULTADO_LABEL[fEstado]||{}).label, clear:()=>setFEstado("")},
    fResponsable && {k:"resp", label:fResponsable, clear:()=>setFResponsable("")},
  ].filter(Boolean);

  return (
    <div style={{display:"flex", flexDirection:"column", gap:"16px"}}>
      <div className="card card-pad">
        <div className="filters">
          <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>
            <option value="">Todos los tipos</option>
            {Object.entries(TIPOS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
          </select>
          <select value={fCategoria} onChange={e=>setFCategoria(e.target.value)}>
            <option value="">Todas las categorías</option>
            {CATEGORIAS.concat(["Endeudamiento"]).map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={fEstado} onChange={e=>setFEstado(e.target.value)}>
            <option value="">Todos los estados</option>
            <option value="en_gestion">En gestión</option>
            <option value="acuerdo_vigente">Acuerdo exitoso (vigente)</option>
            <option value="acuerdo_cumplido">Finalizado — cumplido</option>
            <option value="incumplido_denunciante">Incumplimiento del denunciante</option>
            <option value="incumplido_denunciado">Incumplimiento del denunciado</option>
            <option value="rechazado">No corresponde a la DCI</option>
          </select>
          <select value={fResponsable} onChange={e=>setFResponsable(e.target.value)}>
            <option value="">Todos los responsables</option>
            {RESPONSABLES.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
          <input placeholder="Buscar expediente, DNI, empresa…" value={q} onChange={e=>setQ(e.target.value)} style={{minWidth:"220px", flex:1}}/>
          {(fTipo||fCategoria||fEstado||fResponsable||q) && <button className="btn btn-ghost btn-sm" onClick={()=>{setFTipo("");setFCategoria("");setFEstado("");setFResponsable("");setQ("");}}>Limpiar</button>}
        </div>
        {activeFilters.length>0 && (
          <div style={{display:"flex", gap:"7px", marginTop:"11px", flexWrap:"wrap"}}>
            {activeFilters.map(f=>(
              <span className="chip" key={f.k}>{f.label}<button onClick={f.clear}><IcX/></button></span>
            ))}
          </div>
        )}
      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th className="sortable" onClick={()=>toggleSort("id")}>Caso {sortKey==="id" && <span className="arrow">{sortDir==="asc"?"↑":"↓"}</span>}</th>
              <th className="sortable" onClick={()=>toggleSort("tipo")}>Tipo {sortKey==="tipo" && <span className="arrow">{sortDir==="asc"?"↑":"↓"}</span>}</th>
              <th className="sortable" onClick={()=>toggleSort("denunciante")}>Denunciante {sortKey==="denunciante" && <span className="arrow">{sortDir==="asc"?"↑":"↓"}</span>}</th>
              <th>Empresa/entidad</th>
              <th>Categoría</th>
              <th className="sortable" onClick={()=>toggleSort("fechaIngreso")}>Ingreso {sortKey==="fechaIngreso" && <span className="arrow">{sortDir==="asc"?"↑":"↓"}</span>}</th>
              <th>Responsable</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(c=>(
              <tr key={c.id} onClick={()=>go("detail",{id:c.id})}>
                <td>
                  <div className="cell-strong mono">{c.numeroExpediente || c.id}</div>
                  {c.numeroExpediente && <div className="cell-muted mono">{c.id}</div>}
                </td>
                <td><TipoBadge tipo={c.tipo}/></td>
                <td>
                  <div className="cell-strong">{c.denunciante.nombre}</div>
                  <div className="cell-muted mono">DNI {c.denunciante.dni}</div>
                </td>
                <td>{(c.empresas||[]).map(e=>e.nombre).join(", ")}</td>
                <td>{c.categoria}</td>
                <td className="mono">{fmtDate(c.fechaIngreso)}</td>
                <td>{c.responsable}</td>
                <td><EstadoBadge caso={c}/></td>
              </tr>
            ))}
            {filtered.length===0 && (
              <tr><td colSpan="8"><div className="empty-state"><IcSearch/><div>No se encontraron casos con estos filtros.</div></div></td></tr>
            )}
          </tbody>
        </table>
      </div>
      <div className="small muted">{filtered.length} de {casos.length} casos</div>
    </div>
  );
}

/* ============================== ENDEUDAMIENTO ============================== */
function Endeudamiento({prioritized, weights, setWeights, go}){
  const [showInfo, setShowInfo] = useState(false);
  const activos = prioritized.filter(c=>c.estadoOperativo==="en_gestion");
  const montoTotalGestionado = prioritized.reduce((s,c)=>s+c._montoTotal,0);

  return (
    <div style={{display:"flex", flexDirection:"column", gap:"18px"}}>
      <div className="grid cols-3">
        <KPI label="Casos activos" value={activos.length} sub={prioritized.length+" en total"} tone="accent" icon={<IcCoin/>}/>
        <KPI label="Prioridad alta" value={activos.filter(c=>c._nivel==="alta").length} sub="Requieren atención inmediata" tone="danger" icon={<IcAlert/>}/>
        <KPI label="Monto total gestionado" value={fmtMoney(montoTotalGestionado)} sub="Suma de deudas registradas" tone="primary" icon={<IcChart/>}/>
      </div>

      <div className="card card-pad">
        <div className="section-head">
          <div className="section-title">¿Cómo se calcula la prioridad?</div>
          <button className="link-btn" onClick={()=>setShowInfo(v=>!v)}>{showInfo ? "Ocultar" : "Ajustar ponderación"}</button>
        </div>
        <p className="small muted" style={{marginTop:"-6px"}}>La prioridad combina el <b>monto total adeudado</b> y el <b>mayor tiempo de atraso</b> entre las entidades del caso, normalizados entre 0 y 100. La oficina puede ajustar el peso de cada factor — este es un punto que conviene validar con ustedes antes de fijarlo en la versión final.</p>
        {showInfo && (
          <div style={{display:"flex", flexDirection:"column", gap:"16px", marginTop:"6px", maxWidth:"520px"}}>
            <div>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:"12.5px", fontWeight:700}}>
                <span>Peso del monto de deuda</span><span className="mono">{weights.monto}%</span>
              </div>
              <input type="range" min="0" max="100" value={weights.monto} style={{width:"100%", accentColor:"var(--primary)"}}
                onChange={e=>{ const m=Number(e.target.value); setWeights({monto:m, atraso:100-m}); }}/>
            </div>
            <div>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:"12.5px", fontWeight:700}}>
                <span>Peso del tiempo de atraso</span><span className="mono">{weights.atraso}%</span>
              </div>
              <input type="range" min="0" max="100" value={weights.atraso} style={{width:"100%", accentColor:"var(--accent)"}}
                onChange={e=>{ const a=Number(e.target.value); setWeights({monto:100-a, atraso:a}); }}/>
            </div>
            <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={()=>setWeights({monto:55,atraso:45})}>Restaurar valores por defecto</button>
          </div>
        )}
      </div>

      <div className="card card-pad">
        <div className="section-title" style={{marginBottom:"14px"}}>Casos ordenados por prioridad</div>
        <div style={{display:"flex", flexDirection:"column", gap:"4px"}}>
          <div style={{display:"grid", gridTemplateColumns:"28px 2fr 1.3fr 1fr 1fr 1.4fr", gap:"10px", padding:"0 6px 8px", fontSize:"11px", fontWeight:700, color:"var(--text-faint)", textTransform:"uppercase", letterSpacing:"0.04em", borderBottom:"1px solid var(--border)"}}>
            <span>#</span><span>Consumidor</span><span>Entidades</span><span>Deuda total</span><span>Atraso máx.</span><span>Prioridad</span>
          </div>
          {prioritized.map((c,i)=>(
            <div key={c.id} onClick={()=>go("detail",{id:c.id})} style={{display:"grid", gridTemplateColumns:"28px 2fr 1.3fr 1fr 1fr 1.4fr", gap:"10px", alignItems:"center", padding:"11px 6px", borderBottom:"1px solid var(--border)", cursor:"pointer"}}
              onMouseEnter={e=>e.currentTarget.style.background="var(--surface-hover)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span className="mono muted" style={{fontWeight:700}}>{i+1}</span>
              <div>
                <div style={{fontWeight:700, fontSize:"13px"}}>{c.denunciante.nombre}</div>
                <div className="small muted mono">DNI {c.denunciante.dni} · {c.id}</div>
              </div>
              <div className="small muted">{(c.empresas||[]).map(e=>e.nombre).join(", ")}</div>
              <div className="mono" style={{fontWeight:700}}>{fmtMoney(c._montoTotal)}</div>
              <div className="mono">{c._atrasoMax} días</div>
              <div>
                <div style={{display:"flex", justifyContent:"space-between", marginBottom:"4px"}}>
                  <NivelBadge nivel={c._nivel}/>
                  <span className="mono small" style={{fontWeight:700}}>{c._score.toFixed(0)}</span>
                </div>
                <div className="prio-bar-track">
                  <div className="prio-bar-fill" style={{width:c._score+"%", background: c._nivel==="alta"?"var(--danger)":c._nivel==="media"?"var(--warning)":"var(--success)"}}></div>
                </div>
              </div>
            </div>
          ))}
          {prioritized.length===0 && <div className="empty-state"><IcCoin/><div>Todavía no hay casos de endeudamiento cargados.</div></div>}
        </div>
      </div>
    </div>
  );
}

/* ============================== ESTADÍSTICAS ============================== */
function Estadisticas({casos}){
  const total = casos.length;
  const expedientes = casos.filter(c=>c.tipo==="expediente").length;
  const extra = casos.filter(c=>c.tipo==="extra_expediente").length;
  const endeud = casos.filter(c=>c.tipo==="endeudamiento").length;
  const finalizados = casos.filter(c=>c.resultadoAcuerdo==="acuerdo_cumplido");
  const incumplidos = casos.filter(c=>c.resultadoAcuerdo==="incumplido_denunciante"||c.resultadoAcuerdo==="incumplido_denunciado").length;
  const pctResueltos = Math.round((finalizados.length/Math.max(1,total))*100);

  const tiempoProm = (()=>{
    const dias = finalizados.map(c=>daysBetween(c.fechaIngreso, c.fechaResolucion)).filter(n=>!isNaN(n));
    if(!dias.length) return 0;
    return Math.round(dias.reduce((a,b)=>a+b,0)/dias.length);
  })();

  const montoDeuda = casos.filter(c=>c.tipo==="endeudamiento").reduce((s,c)=>s+(c.entidadesDeuda||[]).reduce((s2,e)=>s2+Number(e.monto||0),0),0);

  const porCategoria = {};
  casos.forEach(c=>{ porCategoria[c.categoria] = (porCategoria[c.categoria]||0)+1; });
  const catData = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));

  const porEmpresa = {};
  casos.forEach(c=> (c.empresas||[]).forEach(e=>{ porEmpresa[e.nombre]=(porEmpresa[e.nombre]||0)+1; }) );
  const empData = Object.entries(porEmpresa).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([label,value])=>({label: label.length>16?label.slice(0,15)+"…":label, value}));

  const meses = ["2026-04","2026-05","2026-06","2026-07","2026-08","2026-09"];
  const mesLabel = {"2026-04":"Abr","2026-05":"May","2026-06":"Jun","2026-07":"Jul","2026-08":"Ago","2026-09":"Sep"};
  const evolData = meses.map(m=>({label:mesLabel[m], value: casos.filter(c=>c.fechaIngreso.startsWith(m)).length}));

  return (
    <div style={{display:"flex", flexDirection:"column", gap:"18px"}}>
      <div className="grid cols-4">
        <KPI label="Casos totales" value={total} tone="primary" icon={<IcFolder/>}/>
        <KPI label="% resueltos" value={pctResueltos+"%"} sub={finalizados.length+" finalizados con acuerdo cumplido"} tone="success" icon={<IcCheck/>}/>
        <KPI label="Tiempo prom. de resolución" value={tiempoProm+" días"} sub="Desde ingreso hasta cierre" tone="info" icon={<IcClock/>}/>
        <KPI label="Monto total de deuda gestionada" value={fmtMoney(montoDeuda)} sub="Casos de endeudamiento" tone="accent" icon={<IcCoin/>}/>
      </div>

      <div className="grid cols-2">
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"14px"}}>Casos por tipo</div>
          <Donut data={[
            {label:"Expedientes", value:expedientes, color:"var(--primary)"},
            {label:"Extra Expedientes", value:extra, color:"var(--info)"},
            {label:"Endeudamiento", value:endeud, color:"var(--accent)"},
          ]}/>
        </div>
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"6px"}}>Evolución de ingresos por mes</div>
          <LineChart data={evolData} color="var(--primary)"/>
        </div>
      </div>

      <div className="grid cols-2">
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"6px"}}>Casos por categoría de reclamo</div>
          <BarChart data={catData} color="var(--primary-2)"/>
        </div>
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"6px"}}>Empresas más denunciadas</div>
          <BarChart data={empData} color="var(--accent)"/>
        </div>
      </div>

      <div className="card card-pad">
        <div className="section-title" style={{marginBottom:"12px"}}>Resultados de gestión</div>
        <div className="grid cols-4">
          <div>
            <div className="small muted">En gestión</div>
            <div style={{fontSize:"20px", fontFamily:"var(--font-display)", fontWeight:800}}>{casos.filter(c=>c.estadoOperativo==="en_gestion").length}</div>
          </div>
          <div>
            <div className="small muted">Con acuerdo vigente</div>
            <div style={{fontSize:"20px", fontFamily:"var(--font-display)", fontWeight:800, color:"var(--success)"}}>{casos.filter(c=>c.resultadoAcuerdo==="acuerdo_vigente").length}</div>
          </div>
          <div>
            <div className="small muted">Con incumplimiento</div>
            <div style={{fontSize:"20px", fontFamily:"var(--font-display)", fontWeight:800, color:"var(--danger)"}}>{incumplidos}</div>
          </div>
          <div>
            <div className="small muted">Finalizados</div>
            <div style={{fontSize:"20px", fontFamily:"var(--font-display)", fontWeight:800}}>{finalizados.length}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== NUEVO CASO (WIZARD) ============================== */
function emptyEmpresa(){ return {nombre:"", domicilio:"", localidad:"", celular:""}; }
function emptyEntidadDeuda(){ return {nombre:"", monto:"", fechaMora:""}; }

function NuevoCaso({casos, onCreate, onCancel}){
  const [step, setStep] = useState(1);
  const [tipo, setTipo] = useState(null);

  const [f, setF] = useState({
    fechaIngreso: TODAY,
    numeroExpediente:"",
    categoria:"Banco",
    responsable:"Administrador",
    nombre:"", dni:"", domicilio:"", localidad:"", celular:"",
    empresas:[emptyEmpresa()],
    descargo:"",
    documentacion:[], docOtra:"",
    observaciones:"", funcionario:"Administrador",
    poseeIngresos:true, ingresoMensual:"", origenIngresos:[], otroOrigen:"", personasDependientes:"",
    entidadesDeuda:[emptyEntidadDeuda()],
    reclamoRealizo:false, reclamoFechaMedio:"", reclamoNumero:"",
  });

  function set(k,v){ setF(prev=>({...prev,[k]:v})); }
  function toggleDoc(list,val,key){
    setF(prev=>{
      const arr = prev[key].includes(val) ? prev[key].filter(x=>x!==val) : [...prev[key], val];
      return {...prev,[key]:arr};
    });
  }
  function updEmpresa(i,patch){ setF(prev=>({...prev, empresas: prev.empresas.map((e,idx)=> idx===i?{...e,...patch}:e)})); }
  function addEmpresa(){ setF(prev=>({...prev, empresas:[...prev.empresas, emptyEmpresa()]})); }
  function rmEmpresa(i){ setF(prev=>({...prev, empresas: prev.empresas.filter((_,idx)=>idx!==i)})); }
  function updDeuda(i,patch){ setF(prev=>({...prev, entidadesDeuda: prev.entidadesDeuda.map((e,idx)=> idx===i?{...e,...patch}:e)})); }
  function addDeuda(){ setF(prev=>({...prev, entidadesDeuda:[...prev.entidadesDeuda, emptyEntidadDeuda()]})); }
  function rmDeuda(i){ setF(prev=>({...prev, entidadesDeuda: prev.entidadesDeuda.filter((_,idx)=>idx!==i)})); }

  const canNextFromType = !!tipo;
  const canNextFromForm = f.nombre.trim() && f.dni.trim() && (tipo==="expediente" ? f.numeroExpediente.trim() : true) &&
    (tipo==="endeudamiento" ? f.entidadesDeuda.some(e=>e.nombre.trim()) : f.empresas.some(e=>e.nombre.trim()));

  function buildCaso(){
    const seq = String(1000 + casos.length).slice(-4);
    const prefix = tipo==="expediente" ? "EXP" : tipo==="endeudamiento" ? "END" : "EXT";
    const id = `${prefix}-2026-0${seq}`;
    const base = {
      id, tipo, categoria: tipo==="endeudamiento" ? "Endeudamiento" : f.categoria,
      fechaIngreso: f.fechaIngreso, fechaResolucion:null, responsable:f.responsable,
      estadoOperativo:"en_gestion", resultadoAcuerdo:"sin_acuerdo",
      denunciante:{nombre:f.nombre, dni:f.dni, domicilio:f.domicilio, localidad:f.localidad, celular:f.celular},
      observaciones:f.observaciones, funcionario:f.funcionario, audiencias:[], casoVinculadoId:null,
      historial:[{id:uid("h"), fecha:new Date().toISOString(), usuario:f.responsable, accion:"Ingreso de caso", estadoAnterior:null, estadoNuevo:"en_gestion", observaciones:"Caso cargado desde el sistema.", contacto:"", resultado:"", proximaAccion:"Primer contacto", fechaProximaAccion:""}],
    };
    if(tipo==="endeudamiento"){
      return {...base,
        numeroExpediente:null,
        empresas: f.entidadesDeuda.filter(e=>e.nombre.trim()).map(e=>({nombre:e.nombre})),
        ingresos:{posee:f.poseeIngresos, ingresoMensual:Number(f.ingresoMensual||0), origen:f.origenIngresos, otroOrigen:f.otroOrigen, personasDependientes:Number(f.personasDependientes||0)},
        entidadesDeuda: f.entidadesDeuda.filter(e=>e.nombre.trim()).map(e=>({nombre:e.nombre, monto:Number(e.monto||0), fechaMora:e.fechaMora||TODAY})),
        reclamosPrevios:{realizo:f.reclamoRealizo, fechaMedio:f.reclamoFechaMedio, numeroReclamo:f.reclamoNumero},
        documentacion:f.documentacion, docOtra:f.docOtra, descargo:f.descargo,
      };
    }
    return {...base,
      numeroExpediente: tipo==="expediente" ? f.numeroExpediente : null,
      empresas: f.empresas.filter(e=>e.nombre.trim()),
      descargo:f.descargo, documentacion:f.documentacion, docOtra:f.docOtra, resolucionGestion:"",
    };
  }

  return (
    <div style={{maxWidth:"760px"}}>
      <div className="stepper">
        <div className={"step"+(step>1?" done":step===1?" active":"")}><span className="num">{step>1?"✓":"1"}</span>Tipo de caso</div>
        <div className="step-line"></div>
        <div className={"step"+(step>2?" done":step===2?" active":"")}><span className="num">{step>2?"✓":"2"}</span>Datos del caso</div>
        <div className="step-line"></div>
        <div className={"step"+(step===3?" active":"")}><span className="num">3</span>Confirmar</div>
      </div>

      {step===1 && (
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"14px"}}>¿Qué tipo de caso vas a registrar?</div>
          <div className="type-pick">
            <button className={"type-card"+(tipo==="expediente"?" sel":"")} onClick={()=>setTipo("expediente")}>
              <div className="ic" style={{background:"var(--primary-tint)", color:"var(--primary)"}}><IcGavel/></div>
              <h4>Expediente</h4>
              <p>Caso formal con número de expediente del sistema oficial de Defensa del Consumidor.</p>
            </button>
            <button className={"type-card"+(tipo==="extra_expediente"?" sel":"")} onClick={()=>setTipo("extra_expediente")}>
              <div className="ic" style={{background:"var(--info-tint)", color:"var(--info)"}}><IcCase/></div>
              <h4>Extra Expediente</h4>
              <p>Gestión informal e interna de la oficina, sin número de expediente oficial.</p>
            </button>
            <button className={"type-card"+(tipo==="endeudamiento"?" sel":"")} onClick={()=>setTipo("endeudamiento")}>
              <div className="ic" style={{background:"var(--accent-tint)", color:"var(--accent)"}}><IcCoin/></div>
              <h4>Endeudamiento</h4>
              <p>Extra Expediente especial: negociación de deuda con una o más entidades financieras.</p>
            </button>
          </div>
          <div className="modal-foot" style={{padding:"22px 0 0", justifyContent:"space-between"}}>
            <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
            <button className="btn btn-primary" disabled={!canNextFromType} onClick={()=>setStep(2)}>Continuar<IcChevR/></button>
          </div>
        </div>
      )}

      {step===2 && tipo!=="endeudamiento" && (
        <div className="card card-pad" style={{display:"flex", flexDirection:"column", gap:"18px"}}>
          <div className="small muted">Formulario "DCI — Expediente / Extra Expediente"</div>
          <div className="grid cols-2">
            <Field label="Fecha de ingreso"><input type="date" value={f.fechaIngreso} onChange={e=>set("fechaIngreso",e.target.value)}/></Field>
            {tipo==="expediente" && <Field label="N° de Expediente" hint="Número oficial del sistema de Defensa del Consumidor"><input type="text" placeholder="Ej: 0250/2026" value={f.numeroExpediente} onChange={e=>set("numeroExpediente",e.target.value)}/></Field>}
          </div>

          <div className="divider"></div>
          <div className="section-title small">Datos del consumidor</div>
          <div className="grid cols-2">
            <Field label="Nombre y apellido"><input type="text" value={f.nombre} onChange={e=>set("nombre",e.target.value)}/></Field>
            <Field label="DNI"><input type="text" value={f.dni} onChange={e=>set("dni",e.target.value)}/></Field>
            <Field label="Domicilio"><input type="text" value={f.domicilio} onChange={e=>set("domicilio",e.target.value)}/></Field>
            <Field label="Localidad"><input type="text" value={f.localidad} onChange={e=>set("localidad",e.target.value)}/></Field>
            <Field label="Celular"><input type="tel" value={f.celular} onChange={e=>set("celular",e.target.value)}/></Field>
            <Field label="Categoría del reclamo"><select value={f.categoria} onChange={e=>set("categoria",e.target.value)}>{CATEGORIAS.map(c=><option key={c}>{c}</option>)}</select></Field>
          </div>

          <div className="divider"></div>
          <div className="section-title small">Empresa/s o entidad/es involucrada/s</div>
          {f.empresas.map((e,i)=>(
            <div key={i} className="card card-pad" style={{background:"var(--surface-2)"}}>
              <div className="grid cols-2">
                <Field label={"Empresa o entidad "+(i+1)}><input type="text" value={e.nombre} onChange={ev=>updEmpresa(i,{nombre:ev.target.value})}/></Field>
                <Field label="Domicilio"><input type="text" value={e.domicilio} onChange={ev=>updEmpresa(i,{domicilio:ev.target.value})}/></Field>
                <Field label="Localidad"><input type="text" value={e.localidad} onChange={ev=>updEmpresa(i,{localidad:ev.target.value})}/></Field>
                <Field label="Celular / teléfono"><input type="tel" value={e.celular} onChange={ev=>updEmpresa(i,{celular:ev.target.value})}/></Field>
              </div>
              {f.empresas.length>1 && <button className="link-btn" style={{marginTop:"10px", color:"var(--danger)"}} onClick={()=>rmEmpresa(i)}>Quitar empresa</button>}
            </div>
          ))}
          <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={addEmpresa}><IcPlus/>Agregar otra empresa/entidad</button>

          <div className="divider"></div>
          <Field label="Descargo / planteo del consumidor" hint="Hechos, origen del conflicto y gestiones ya realizadas ante la empresa">
            <textarea value={f.descargo} onChange={e=>set("descargo",e.target.value)}/>
          </Field>

          <div className="section-title small">Documentación aportada</div>
          <div className="check-grid">
            {DOC_OPCIONES_GENERAL.map(d=>(
              <label className="checkline" key={d}><input type="checkbox" checked={f.documentacion.includes(d)} onChange={()=>toggleDoc(f.documentacion,d,"documentacion")}/>{d}</label>
            ))}
          </div>
          <Field label="Otra documentación (opcional)"><input type="text" value={f.docOtra} onChange={e=>set("docOtra",e.target.value)}/></Field>

          <div className="divider"></div>
          <div className="grid cols-2">
            <Field label="Responsable del caso"><select value={f.responsable} onChange={e=>set("responsable",e.target.value)}>{RESPONSABLES.map(r=><option key={r}>{r}</option>)}</select></Field>
            <Field label="Funcionario/a interviniente"><input type="text" value={f.funcionario} onChange={e=>set("funcionario",e.target.value)}/></Field>
          </div>
          <Field label="Observaciones"><textarea value={f.observaciones} onChange={e=>set("observaciones",e.target.value)} style={{minHeight:"64px"}}/></Field>

          <div className="modal-foot" style={{padding:"6px 0 0", justifyContent:"space-between"}}>
            <button className="btn btn-ghost" onClick={()=>setStep(1)}><IcChevL/>Atrás</button>
            <button className="btn btn-primary" disabled={!canNextFromForm} onClick={()=>setStep(3)}>Revisar y confirmar<IcChevR/></button>
          </div>
        </div>
      )}

      {step===2 && tipo==="endeudamiento" && (
        <div className="card card-pad" style={{display:"flex", flexDirection:"column", gap:"18px"}}>
          <div className="small muted">Formulario "DCI — Por deudas"</div>
          <div className="grid cols-2">
            <Field label="Fecha de ingreso"><input type="date" value={f.fechaIngreso} onChange={e=>set("fechaIngreso",e.target.value)}/></Field>
            <Field label="Responsable del caso"><select value={f.responsable} onChange={e=>set("responsable",e.target.value)}>{RESPONSABLES.map(r=><option key={r}>{r}</option>)}</select></Field>
          </div>

          <div className="divider"></div>
          <div className="section-title small">Datos del consumidor</div>
          <div className="grid cols-2">
            <Field label="Apellido y nombre"><input type="text" value={f.nombre} onChange={e=>set("nombre",e.target.value)}/></Field>
            <Field label="DNI"><input type="text" value={f.dni} onChange={e=>set("dni",e.target.value)}/></Field>
            <Field label="Domicilio"><input type="text" value={f.domicilio} onChange={e=>set("domicilio",e.target.value)}/></Field>
            <Field label="Localidad"><input type="text" value={f.localidad} onChange={e=>set("localidad",e.target.value)}/></Field>
            <Field label="Celular"><input type="tel" value={f.celular} onChange={e=>set("celular",e.target.value)}/></Field>
          </div>

          <div className="divider"></div>
          <div className="section-title small">Situación de ingresos</div>
          <div className="radio-cards">
            <div className={"radio-card"+(f.poseeIngresos?" sel":"")} onClick={()=>set("poseeIngresos",true)}>Posee ingresos</div>
            <div className={"radio-card"+(!f.poseeIngresos?" sel":"")} onClick={()=>set("poseeIngresos",false)}>No posee ingresos</div>
          </div>
          <div className="grid cols-2">
            <Field label="Ingreso mensual aproximado"><input type="number" placeholder="$" value={f.ingresoMensual} onChange={e=>set("ingresoMensual",e.target.value)}/></Field>
            <Field label="Personas que dependen de dicho ingreso"><input type="number" value={f.personasDependientes} onChange={e=>set("personasDependientes",e.target.value)}/></Field>
          </div>
          <div className="section-title small">Origen de los ingresos</div>
          <div className="check-grid">
            {ORIGEN_INGRESOS.map(o=>(
              <label className="checkline" key={o}><input type="checkbox" checked={f.origenIngresos.includes(o)} onChange={()=>toggleDoc(f.origenIngresos,o,"origenIngresos")}/>{o}</label>
            ))}
          </div>
          <Field label="Otro origen (opcional)"><input type="text" value={f.otroOrigen} onChange={e=>set("otroOrigen",e.target.value)}/></Field>

          <div className="divider"></div>
          <div className="section-title small">Entidades con las que mantiene la deuda</div>
          <div className="hint" style={{marginTop:"-10px"}}>La fecha de mora es un campo que agregamos nosotros (no está en la ficha en papel): es necesario para calcular el tiempo de atraso y la prioridad automática — a confirmar con la oficina si prefieren cargarlo distinto.</div>
          {f.entidadesDeuda.map((e,i)=>(
            <div key={i} className="card card-pad" style={{background:"var(--surface-2)"}}>
              <div className="grid cols-3">
                <Field label="Nombre de la entidad"><input type="text" value={e.nombre} onChange={ev=>updDeuda(i,{nombre:ev.target.value})}/></Field>
                <Field label="Monto aproximado de deuda"><input type="number" placeholder="$" value={e.monto} onChange={ev=>updDeuda(i,{monto:ev.target.value})}/></Field>
                <Field label="Fecha desde que está en mora"><input type="date" value={e.fechaMora} onChange={ev=>updDeuda(i,{fechaMora:ev.target.value})}/></Field>
              </div>
              {f.entidadesDeuda.length>1 && <button className="link-btn" style={{marginTop:"10px", color:"var(--danger)"}} onClick={()=>rmDeuda(i)}>Quitar entidad</button>}
            </div>
          ))}
          <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={addDeuda}><IcPlus/>Agregar otra entidad</button>
          <div className="small" style={{fontWeight:700}}>Total aproximado de deuda: <span className="mono">{fmtMoney(f.entidadesDeuda.reduce((s,e)=>s+Number(e.monto||0),0))}</span></div>

          <div className="divider"></div>
          <Field label="Descargo / descripción de la problemática" hint="Cómo se originó, entidades involucradas, cuotas, pagos y reclamos realizados">
            <textarea value={f.descargo} onChange={e=>set("descargo",e.target.value)}/>
          </Field>

          <div className="section-title small">Reclamos o gestiones previas</div>
          <div className="radio-cards">
            <div className={"radio-card"+(f.reclamoRealizo?" sel":"")} onClick={()=>set("reclamoRealizo",true)}>Sí, ya reclamó</div>
            <div className={"radio-card"+(!f.reclamoRealizo?" sel":"")} onClick={()=>set("reclamoRealizo",false)}>No realizó reclamos</div>
          </div>
          {f.reclamoRealizo && (
            <div className="grid cols-2">
              <Field label="Fecha y medio utilizado"><input type="text" value={f.reclamoFechaMedio} onChange={e=>set("reclamoFechaMedio",e.target.value)}/></Field>
              <Field label="N° de reclamo o gestión (si posee)"><input type="text" value={f.reclamoNumero} onChange={e=>set("reclamoNumero",e.target.value)}/></Field>
            </div>
          )}

          <div className="section-title small">Documentación aportada</div>
          <div className="check-grid">
            {DOC_OPCIONES_DEUDA.map(d=>(
              <label className="checkline" key={d}><input type="checkbox" checked={f.documentacion.includes(d)} onChange={()=>toggleDoc(f.documentacion,d,"documentacion")}/>{d}</label>
            ))}
          </div>
          <Field label="Otra documentación (opcional)"><input type="text" value={f.docOtra} onChange={e=>set("docOtra",e.target.value)}/></Field>

          <Field label="Observaciones (uso interno)"><textarea value={f.observaciones} onChange={e=>set("observaciones",e.target.value)} style={{minHeight:"64px"}}/></Field>

          <div className="modal-foot" style={{padding:"6px 0 0", justifyContent:"space-between"}}>
            <button className="btn btn-ghost" onClick={()=>setStep(1)}><IcChevL/>Atrás</button>
            <button className="btn btn-primary" disabled={!canNextFromForm} onClick={()=>setStep(3)}>Revisar y confirmar<IcChevR/></button>
          </div>
        </div>
      )}

      {step===3 && (
        <div className="card card-pad" style={{display:"flex", flexDirection:"column", gap:"14px"}}>
          <div className="section-title">Confirmar creación del caso</div>
          <div className="grid cols-2">
            <div><div className="small muted">Tipo de caso</div><div style={{fontWeight:700}}><TipoBadge tipo={tipo}/></div></div>
            <div><div className="small muted">Fecha de ingreso</div><div style={{fontWeight:700}}>{fmtDate(f.fechaIngreso)}</div></div>
            <div><div className="small muted">Consumidor</div><div style={{fontWeight:700}}>{f.nombre} (DNI {f.dni})</div></div>
            <div><div className="small muted">Responsable</div><div style={{fontWeight:700}}>{f.responsable}</div></div>
            {tipo==="expediente" && <div><div className="small muted">N° de expediente</div><div style={{fontWeight:700}} className="mono">{f.numeroExpediente}</div></div>}
            <div>
              <div className="small muted">{tipo==="endeudamiento" ? "Entidades" : "Empresa/s"}</div>
              <div style={{fontWeight:700}}>{tipo==="endeudamiento" ? f.entidadesDeuda.filter(e=>e.nombre).map(e=>e.nombre).join(", ") : f.empresas.filter(e=>e.nombre).map(e=>e.nombre).join(", ")}</div>
            </div>
          </div>
          {tipo==="endeudamiento" && (
            <div className="card card-pad" style={{background:"var(--accent-tint)", borderColor:"transparent"}}>
              <div className="small" style={{fontWeight:700, color:"var(--accent)"}}>Deuda total aproximada: {fmtMoney(f.entidadesDeuda.reduce((s,e)=>s+Number(e.monto||0),0))}</div>
              <div className="small muted" style={{marginTop:"3px"}}>El caso ingresará a la pantalla especial de Endeudamiento y su prioridad se calculará automáticamente.</div>
            </div>
          )}
          <div className="modal-foot" style={{padding:"6px 0 0", justifyContent:"space-between"}}>
            <button className="btn btn-ghost" onClick={()=>setStep(2)}><IcChevL/>Atrás</button>
            <button className="btn btn-accent" onClick={()=>onCreate(buildCaso())}><IcCheck/>Crear caso</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== FICHA DE CASO ============================== */
function ModalCambioEstado({caso, onClose, onSave}){
  const [operativo, setOperativo] = useState(caso.estadoOperativo);
  const [resultado, setResultado] = useState(caso.resultadoAcuerdo);
  const [obs, setObs] = useState("");
  const [momentoResolucion, setMomentoResolucion] = useState(caso.resolucionMomento || "antes_audiencia");
  const [numeroAudiencia, setNumeroAudiencia] = useState("");

  const necesitaAudiencia = caso.tipo==="expediente" && (resultado==="acuerdo_cumplido" || operativo==="cerrado") && momentoResolucion==="audiencia";

  return (
    <Modal title="Cambiar estado del caso" onClose={onClose} foot={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onSave({operativo,resultado,obs,momentoResolucion,numeroAudiencia})}>Guardar cambio</button>
      </>
    }>
      <Field label="Estado operativo">
        <select value={operativo} onChange={e=>setOperativo(e.target.value)}>
          <option value="en_gestion">En gestión</option>
          <option value="cerrado">Cerrado</option>
        </select>
      </Field>
      <Field label="Resultado del acuerdo">
        <select value={resultado} onChange={e=>setResultado(e.target.value)}>
          <option value="sin_acuerdo">Sin acuerdo aún</option>
          <option value="acuerdo_vigente">Acuerdo exitoso (vigente)</option>
          <option value="acuerdo_cumplido">Finalizado — acuerdo cumplido</option>
          <option value="incumplido_denunciante">Incumplimiento del denunciante</option>
          <option value="incumplido_denunciado">Incumplimiento del denunciado</option>
          <option value="rechazado">No corresponde a la DCI</option>
        </select>
      </Field>
      {caso.tipo==="expediente" && (resultado==="acuerdo_cumplido") && (
        <Field label="¿Cómo se resolvió?">
          <div className="radio-cards">
            <div className={"radio-card"+(momentoResolucion==="antes_audiencia"?" sel":"")} onClick={()=>setMomentoResolucion("antes_audiencia")}>Antes de audiencia</div>
            <div className={"radio-card"+(momentoResolucion==="audiencia"?" sel":"")} onClick={()=>setMomentoResolucion("audiencia")}>En audiencia</div>
          </div>
        </Field>
      )}
      {necesitaAudiencia && (
        <Field label="Número de expediente de audiencia" hint="El número original y el de audiencia conviven; se podrá buscar el caso por ambos.">
          <input type="text" value={numeroAudiencia} onChange={e=>setNumeroAudiencia(e.target.value)} placeholder="Ej: AUD-0142-A"/>
        </Field>
      )}
      <Field label="Observaciones del cambio"><textarea value={obs} onChange={e=>setObs(e.target.value)}/></Field>
    </Modal>
  );
}

function ModalGestion({onClose, onSave}){
  const [accion, setAccion] = useState("Contacto realizado");
  const [contacto, setContacto] = useState("Teléfono");
  const [resultado, setResultado] = useState("");
  const [obs, setObs] = useState("");
  const [proximaAccion, setProximaAccion] = useState("");
  const [fechaProxima, setFechaProxima] = useState("");
  return (
    <Modal title="Registrar gestión / movimiento" onClose={onClose} foot={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onSave({accion,contacto,resultado,obs,proximaAccion,fechaProxima})}>Guardar gestión</button>
      </>
    }>
      <div className="grid cols-2">
        <Field label="Acción realizada">
          <select value={accion} onChange={e=>setAccion(e.target.value)}>
            <option>Contacto realizado</option>
            <option>Envío de documentación</option>
            <option>Notificación / cédula enviada</option>
            <option>Audiencia realizada</option>
            <option>Llamado sin respuesta</option>
            <option>Otro</option>
          </select>
        </Field>
        <Field label="Medio de contacto">
          <select value={contacto} onChange={e=>setContacto(e.target.value)}>
            <option>Teléfono</option><option>Email</option><option>Presencial</option><option>Cédula / correo postal</option><option>WhatsApp</option>
          </select>
        </Field>
      </div>
      <Field label="Resultado obtenido"><input type="text" value={resultado} onChange={e=>setResultado(e.target.value)}/></Field>
      <Field label="Observaciones"><textarea value={obs} onChange={e=>setObs(e.target.value)}/></Field>
      <div className="grid cols-2">
        <Field label="Próxima acción"><input type="text" value={proximaAccion} onChange={e=>setProximaAccion(e.target.value)}/></Field>
        <Field label="Fecha de próxima acción"><input type="date" value={fechaProxima} onChange={e=>setFechaProxima(e.target.value)}/></Field>
      </div>
    </Modal>
  );
}

function ModalVincular({caso, onClose, onCreate}){
  const [numeroExpediente, setNumeroExpediente] = useState("");
  return (
    <Modal title="Crear Expediente vinculado" onClose={onClose} foot={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!numeroExpediente.trim()} onClick={()=>onCreate(numeroExpediente)}>Crear expediente vinculado</button>
      </>
    }>
      <p className="small muted">Este Extra Expediente no logró resolverse por vía directa. Se creará un caso nuevo de tipo Expediente, vinculado a este, conservando los datos del consumidor y el historial de gestión ya realizado.</p>
      <Field label="Número de expediente oficial"><input type="text" value={numeroExpediente} onChange={e=>setNumeroExpediente(e.target.value)} placeholder="Ej: 0300/2026"/></Field>
    </Modal>
  );
}

function FichaCaso({caso, casos, onUpdate, onAddHistorial, onCreateLinked, go, notify}){
  const [tab, setTab] = useState("general");
  const [showEstado, setShowEstado] = useState(false);
  const [showGestion, setShowGestion] = useState(false);
  const [showVincular, setShowVincular] = useState(false);

  const vinculado = caso.casoVinculadoId ? casos.find(c=>c.id===caso.casoVinculadoId) : null;
  const stats = caso.tipo==="endeudamiento" ? casoStats(caso) : null;
  const canReabrir = caso.estadoOperativo==="cerrado";

  function handleCambioEstado({operativo,resultado,obs,momentoResolucion,numeroAudiencia}){
    const entry = {id:uid("h"), fecha:new Date().toISOString(), usuario:"Administrador", accion:"Cambio de estado", estadoAnterior:caso.resultadoAcuerdo, estadoNuevo:resultado, observaciones:obs, contacto:"", resultado:"", proximaAccion:"", fechaProximaAccion:""};
    let patch = {estadoOperativo:operativo, resultadoAcuerdo:resultado};
    if(resultado==="acuerdo_cumplido" && caso.fechaResolucion==null){ patch.fechaResolucion = TODAY; }
    if(caso.tipo==="expediente" && resultado==="acuerdo_cumplido"){
      patch.resolucionMomento = momentoResolucion;
      if(momentoResolucion==="audiencia" && numeroAudiencia.trim()){
        patch.audiencias = [...(caso.audiencias||[]), {numero:numeroAudiencia.trim(), fecha:TODAY}];
      }
    }
    onUpdate(caso.id, patch);
    onAddHistorial(caso.id, entry);
    setShowEstado(false);
    notify("Estado actualizado");
  }

  function handleGestion(g){
    const entry = {id:uid("h"), fecha:new Date().toISOString(), usuario:"Administrador", accion:g.accion, estadoAnterior:caso.resultadoAcuerdo, estadoNuevo:caso.resultadoAcuerdo, observaciones:g.obs, contacto:g.contacto, resultado:g.resultado, proximaAccion:g.proximaAccion, fechaProximaAccion:g.fechaProxima};
    onAddHistorial(caso.id, entry);
    setShowGestion(false);
    notify("Gestión registrada");
  }

  function handleReabrir(){
    const entry = {id:uid("h"), fecha:new Date().toISOString(), usuario:"Administrador", accion:"Reapertura de caso", estadoAnterior:caso.resultadoAcuerdo, estadoNuevo:"en_gestion", observaciones:"Caso reabierto para nueva gestión.", contacto:"", resultado:"", proximaAccion:"", fechaProximaAccion:""};
    onUpdate(caso.id, {estadoOperativo:"en_gestion"});
    onAddHistorial(caso.id, entry);
    notify("Caso reabierto");
  }

  function handleVincular(numeroExpediente){
    const nuevoId = "EXP-2026-0"+String(1000+casos.length).slice(-4);
    const nuevo = {
      ...caso, id:nuevoId, tipo:"expediente", numeroExpediente, fechaIngreso:TODAY, fechaResolucion:null,
      estadoOperativo:"en_gestion", resultadoAcuerdo:"sin_acuerdo", casoVinculadoId:caso.id, audiencias:[],
      historial:[{id:uid("h"), fecha:new Date().toISOString(), usuario:"Administrador", accion:"Ingreso de caso", estadoAnterior:null, estadoNuevo:"en_gestion", observaciones:"Caso creado a partir del Extra Expediente "+caso.id+" al no lograr resolución directa.", contacto:"", resultado:"", proximaAccion:"", fechaProximaAccion:""}],
    };
    onUpdate(caso.id, {casoVinculadoId:nuevoId, estadoOperativo:"cerrado"});
    onCreateLinked(nuevo);
    setShowVincular(false);
    go("detail",{id:nuevoId});
  }

  return (
    <div>
      <div className="breadcrumb"><button onClick={()=>go("list")}>Bandeja de casos</button> <IcChevR style={{width:11,height:11}}/> <span>{caso.id}</span></div>

      <div className="card card-pad" style={{marginBottom:"18px"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:"14px"}}>
          <div>
            <div style={{display:"flex", alignItems:"center", gap:"10px", flexWrap:"wrap"}}>
              <h2 style={{fontSize:"20px"}}>{caso.numeroExpediente || caso.id}</h2>
              <TipoBadge tipo={caso.tipo}/>
              <EstadoBadge caso={caso}/>
            </div>
            <div className="small muted" style={{marginTop:"4px"}}>
              {caso.id!==caso.numeroExpediente && caso.numeroExpediente && <span className="mono">{caso.id} · </span>}
              {caso.denunciante.nombre} · DNI {caso.denunciante.dni} · Ingresado el {fmtDate(caso.fechaIngreso)} · Responsable: {caso.responsable}
            </div>
            {caso.audiencias && caso.audiencias.length>0 && (
              <div style={{marginTop:"8px", display:"flex", gap:"6px", flexWrap:"wrap"}}>
                {caso.audiencias.map((a,i)=>(<Badge tone="b-primary" key={i}><IcGavel/> Audiencia: {a.numero} ({fmtDate(a.fecha)})</Badge>))}
              </div>
            )}
            {vinculado && (
              <div style={{marginTop:"8px"}}>
                <button className="link-btn" onClick={()=>go("detail",{id:vinculado.id})} style={{display:"inline-flex", alignItems:"center", gap:"5px"}}>
                  <IcLink style={{width:12,height:12}}/> Caso vinculado: {vinculado.id} ({TIPOS[vinculado.tipo]})
                </button>
              </div>
            )}
          </div>
          <div style={{display:"flex", gap:"8px", flexWrap:"wrap"}}>
            {caso.tipo==="extra_expediente" && !caso.casoVinculadoId && caso.estadoOperativo==="en_gestion" && (
              <button className="btn btn-sm" onClick={()=>setShowVincular(true)}><IcLink/>Vincular a Expediente</button>
            )}
            {canReabrir && <button className="btn btn-sm" onClick={handleReabrir}><IcRotate/>Reabrir caso</button>}
            <button className="btn btn-sm" onClick={()=>setShowGestion(true)}><IcPlus/>Registrar gestión</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowEstado(true)}><IcFlag/>Cambiar estado</button>
          </div>
        </div>

        {caso.tipo==="endeudamiento" && stats && (
          <div className="grid cols-3" style={{marginTop:"18px"}}>
            <div className="card card-pad" style={{background:"var(--surface-2)"}}>
              <div className="small muted">Deuda total</div>
              <div className="mono" style={{fontSize:"18px", fontWeight:800}}>{fmtMoney(stats.montoTotal)}</div>
            </div>
            <div className="card card-pad" style={{background:"var(--surface-2)"}}>
              <div className="small muted">Atraso máximo</div>
              <div className="mono" style={{fontSize:"18px", fontWeight:800}}>{stats.atrasoMax} días</div>
            </div>
            <div className="card card-pad" style={{background:"var(--surface-2)"}}>
              <div className="small muted">Ingreso mensual declarado</div>
              <div className="mono" style={{fontSize:"18px", fontWeight:800}}>{caso.ingresos ? fmtMoney(caso.ingresos.ingresoMensual) : "—"}</div>
            </div>
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={"tab"+(tab==="general"?" active":"")} onClick={()=>setTab("general")}>Datos generales</button>
        {caso.tipo==="endeudamiento" && <button className={"tab"+(tab==="deuda"?" active":"")} onClick={()=>setTab("deuda")}>Situación de deuda</button>}
        <button className={"tab"+(tab==="doc"?" active":"")} onClick={()=>setTab("doc")}>Documentación</button>
        <button className={"tab"+(tab==="historial"?" active":"")} onClick={()=>setTab("historial")}>Historial de gestiones</button>
      </div>

      {tab==="general" && (
        <div className="grid cols-2">
          <div className="card card-pad">
            <div className="section-title" style={{marginBottom:"12px"}}><IcUsers/> Consumidor</div>
            <DL rows={[["Nombre y apellido",caso.denunciante.nombre],["DNI",caso.denunciante.dni],["Domicilio",caso.denunciante.domicilio||"—"],["Localidad",caso.denunciante.localidad||"—"],["Celular",caso.denunciante.celular||"—"]]}/>
          </div>
          <div className="card card-pad">
            <div className="section-title" style={{marginBottom:"12px"}}><IcBuilding/> {caso.tipo==="endeudamiento" ? "Entidades involucradas" : "Empresa/s involucrada/s"}</div>
            {(caso.empresas||[]).map((e,i)=>(
              <div key={i} style={{padding:"9px 0", borderBottom: i<caso.empresas.length-1 ? "1px solid var(--border)":"none"}}>
                <div style={{fontWeight:700, fontSize:"13px"}}>{e.nombre}</div>
                {e.domicilio && <div className="small muted">{e.domicilio}{e.localidad?", "+e.localidad:""}</div>}
                {e.celular && <div className="small muted mono">{e.celular}</div>}
              </div>
            ))}
          </div>
          <div className="card card-pad" style={{gridColumn:"1 / -1"}}>
            <div className="section-title" style={{marginBottom:"10px"}}>Descargo / planteo del consumidor</div>
            <p className="small" style={{lineHeight:1.6, color:"var(--text-muted)"}}>{caso.descargo || "Sin descripción cargada."}</p>
          </div>
          {caso.resolucionGestion && (
            <div className="card card-pad" style={{gridColumn:"1 / -1", background:"var(--success-tint)", border:"none"}}>
              <div className="section-title" style={{marginBottom:"8px", color:"var(--success)"}}>Resolución / resultado de la gestión</div>
              <p className="small" style={{lineHeight:1.6}}>{caso.resolucionGestion}</p>
            </div>
          )}
          {caso.observaciones && (
            <div className="card card-pad" style={{gridColumn:"1 / -1"}}>
              <div className="section-title" style={{marginBottom:"8px"}}>Observaciones</div>
              <p className="small muted" style={{lineHeight:1.6}}>{caso.observaciones}</p>
              {caso.funcionario && <div className="small muted" style={{marginTop:"6px"}}>Funcionario/a interviniente: <b style={{color:"var(--text)"}}>{caso.funcionario}</b></div>}
            </div>
          )}
        </div>
      )}

      {tab==="deuda" && caso.tipo==="endeudamiento" && (
        <div className="grid cols-2">
          <div className="card card-pad">
            <div className="section-title" style={{marginBottom:"12px"}}>Situación de ingresos</div>
            <DL rows={[
              ["¿Posee ingresos?", caso.ingresos.posee ? "Sí" : "No"],
              ["Ingreso mensual aproximado", fmtMoney(caso.ingresos.ingresoMensual)],
              ["Origen de los ingresos", (caso.ingresos.origen||[]).join(", ")||"—"],
              ["Personas que dependen del ingreso", String(caso.ingresos.personasDependientes)],
            ]}/>
          </div>
          <div className="card card-pad">
            <div className="section-title" style={{marginBottom:"12px"}}>Reclamos o gestiones previas</div>
            <DL rows={[
              ["¿Realizó reclamos previos?", caso.reclamosPrevios.realizo ? "Sí" : "No"],
              ["Fecha y medio utilizado", caso.reclamosPrevios.fechaMedio || "—"],
              ["N° de reclamo o gestión", caso.reclamosPrevios.numeroReclamo || "—"],
            ]}/>
          </div>
          <div className="card card-pad" style={{gridColumn:"1 / -1"}}>
            <div className="section-title" style={{marginBottom:"12px"}}>Entidades con las que mantiene la deuda</div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Entidad</th><th>Monto aproximado</th><th>En mora desde</th><th>Días de atraso</th></tr></thead>
                <tbody>
                  {caso.entidadesDeuda.map((e,i)=>(
                    <tr key={i} style={{cursor:"default"}}>
                      <td className="cell-strong">{e.nombre}</td>
                      <td className="mono">{fmtMoney(e.monto)}</td>
                      <td className="mono">{fmtDate(e.fechaMora)}</td>
                      <td className="mono">{daysBetween(e.fechaMora, TODAY)} días</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {tab==="doc" && (
        <div className="card card-pad">
          <div className="section-title" style={{marginBottom:"12px"}}>Documentación aportada</div>
          {(caso.documentacion||[]).length===0 && !caso.docOtra ? (
            <div className="empty-state"><IcPaperclip/><div>No se cargó documentación para este caso.</div></div>
          ) : (
            <div style={{display:"flex", flexDirection:"column", gap:"9px"}}>
              {(caso.documentacion||[]).map(d=>(
                <div key={d} style={{display:"flex", alignItems:"center", gap:"9px", fontSize:"13px"}}>
                  <span style={{color:"var(--success)"}}><IcCheck style={{width:15,height:15}}/></span>{d}
                </div>
              ))}
              {caso.docOtra && <div style={{display:"flex", alignItems:"center", gap:"9px", fontSize:"13px"}}><span style={{color:"var(--success)"}}><IcCheck style={{width:15,height:15}}/></span>Otra: {caso.docOtra}</div>}
            </div>
          )}
        </div>
      )}

      {tab==="historial" && (
        <div className="card card-pad">
          <div className="section-head">
            <div className="section-title">Historial de gestiones</div>
            <button className="btn btn-sm btn-primary" onClick={()=>setShowGestion(true)}><IcPlus/>Registrar gestión</button>
          </div>
          <div className="timeline">
            {[...caso.historial].reverse().map(h=>(
              <div className="tl-item" key={h.id}>
                <div className="tl-dot"></div>
                <div className="tl-head"><span className="tl-title">{h.accion}</span><span className="tl-date">{fmtDateTime(h.fecha)}</span></div>
                {h.observaciones && <div className="tl-body">{h.observaciones}</div>}
                <div className="tl-meta">
                  <span><b>Usuario:</b> {h.usuario}</span>
                  {h.contacto && <span><b>Contacto:</b> {h.contacto}</span>}
                  {h.resultado && <span><b>Resultado:</b> {h.resultado}</span>}
                  {h.estadoAnterior!==h.estadoNuevo && h.estadoAnterior && <span><b>Estado:</b> {(RESULTADO_LABEL[h.estadoAnterior]||{}).label} → {(RESULTADO_LABEL[h.estadoNuevo]||{}).label}</span>}
                  {h.proximaAccion && <span><b>Próxima acción:</b> {h.proximaAccion} {h.fechaProximaAccion?`(${fmtDate(h.fechaProximaAccion)})`:""}</span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {showEstado && <ModalCambioEstado caso={caso} onClose={()=>setShowEstado(false)} onSave={handleCambioEstado}/>}
      {showGestion && <ModalGestion onClose={()=>setShowGestion(false)} onSave={handleGestion}/>}
      {showVincular && <ModalVincular caso={caso} onClose={()=>setShowVincular(false)} onCreate={handleVincular}/>}
    </div>
  );
}

function DL({rows}){
  return (
    <div style={{display:"flex", flexDirection:"column", gap:"9px"}}>
      {rows.map(([k,v],i)=>(
        <div key={i} style={{display:"flex", justifyContent:"space-between", gap:"12px", fontSize:"13px"}}>
          <span className="muted">{k}</span><span style={{fontWeight:700, textAlign:"right"}}>{v}</span>
        </div>
      ))}
    </div>
  );
}

/* ============================== CONFIGURACIÓN ============================== */
function Configuracion({weights, setWeights, theme, setTheme}){
  return (
    <div style={{display:"flex", flexDirection:"column", gap:"18px", maxWidth:"680px"}}>
      <div className="card card-pad">
        <div className="section-title" style={{marginBottom:"10px"}}><IcUsers/> Roles y permisos</div>
        <p className="small muted">Por ahora el sistema funciona con un único rol: <b style={{color:"var(--text)"}}>Administrador</b>, con acceso completo a todos los casos. La estructura está preparada para agregar roles con permisos más acotados en el futuro (por ejemplo, un rol que solo pueda gestionar sus propios casos asignados, o un rol de Dirección de solo lectura sobre estadísticas).</p>
        <div style={{marginTop:"12px", display:"flex", flexDirection:"column", gap:"8px"}}>
          {[{n:"Administrador", d:"Acceso total (activo)", on:true},{n:"Gestor de casos", d:"Editaría solo sus casos asignados — a definir", on:false},{n:"Dirección (solo lectura)", d:"Vería estadísticas y dashboard sin editar — a definir", on:false}].map(r=>(
            <div key={r.n} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", border:"1px solid var(--border)", borderRadius:"var(--radius-sm)", background: r.on ? "var(--primary-tint)":"var(--surface-2)"}}>
              <div>
                <div style={{fontWeight:700, fontSize:"13px"}}>{r.n}</div>
                <div className="small muted">{r.d}</div>
              </div>
              <Badge tone={r.on?"b-success":"b-neutral"}>{r.on?"Activo":"Próximamente"}</Badge>
            </div>
          ))}
        </div>
      </div>

      <div className="card card-pad">
        <div className="section-title" style={{marginBottom:"10px"}}>Apariencia</div>
        <div className="radio-cards">
          <div className={"radio-card"+(theme==="system"?" sel":"")} onClick={()=>setTheme("system")}>Automático</div>
          <div className={"radio-card"+(theme==="light"?" sel":"")} onClick={()=>setTheme("light")}>Claro</div>
          <div className={"radio-card"+(theme==="dark"?" sel":"")} onClick={()=>setTheme("dark")}>Oscuro</div>
        </div>
      </div>

      <div className="card card-pad">
        <div className="section-title" style={{marginBottom:"6px"}}>Sobre esta demo</div>
        <p className="small muted" style={{lineHeight:1.6}}>
          Esta es una demo de <b>solo frontend</b>, pensada para mostrar el funcionamiento propuesto a la oficina.
          Los datos son de ejemplo y se guardan únicamente en este navegador (no hay servidor ni base de datos real todavía).
          Varios criterios acá reflejados — como la fórmula de prioridad de endeudamiento o el listado de categorías — quedan
          <b> a confirmar con la oficina</b> antes de pasar a una versión de producción.
        </p>
      </div>
    </div>
  );
}

/* ============================== MOUNT ============================== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
