<title>Gestión de Casos DCI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-hover:#EEF2F7;
    --border:#E0E4EB; --border-strong:#C9D0DA;
    --text:#171B24; --text-muted:#5B6472; --text-faint:#8891A0;
    --primary:#123A6B; --primary-2:#1F4E8C; --primary-tint:#E8EEF7;
    --accent:#C81E2C; --accent-2:#A5121F; --accent-tint:#FBE8E9;
    --success:#1F8A5F; --success-tint:#E3F5EC;
    --warning:#B9750E; --warning-tint:#FBF0DE;
    --danger:#C0432B; --danger-tint:#FAEAE5;
    --info:#2F6FB0; --info-tint:#E7EFF9;
    --shadow-sm: 0 1px 2px rgba(20,30,50,0.06), 0 1px 1px rgba(20,30,50,0.04);
    --shadow-md: 0 4px 16px rgba(20,30,50,0.10), 0 2px 6px rgba(20,30,50,0.06);
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --font-display:'Libre Franklin', 'Segoe UI', sans-serif;
    --font-body:'Public Sans', 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --surface-hover:#212B3D;
      --border:#2A3448; --border-strong:#3A4660;
      --text:#E8EBF2; --text-muted:#A6AFC2; --text-faint:#6E7890;
      --primary:#5C8FD6; --primary-2:#7CA6E0; --primary-tint:#1A2A42;
      --accent:#E8606A; --accent-2:#F08088; --accent-tint:#3A1C20;
      --success:#46C08A; --success-tint:#0F2E22;
      --warning:#E2AC4C; --warning-tint:#332811;
      --danger:#E37E5F; --danger-tint:#33201A;
      --info:#6DA3DD; --info-tint:#16263A;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --surface-hover:#212B3D;
    --border:#2A3448; --border-strong:#3A4660;
    --text:#E8EBF2; --text-muted:#A6AFC2; --text-faint:#6E7890;
    --primary:#5C8FD6; --primary-2:#7CA6E0; --primary-tint:#1A2A42;
    --accent:#E8606A; --accent-2:#F08088; --accent-tint:#3A1C20;
    --success:#46C08A; --success-tint:#0F2E22;
    --warning:#E2AC4C; --warning-tint:#332811;
    --danger:#E37E5F; --danger-tint:#33201A;
    --info:#6DA3DD; --info-tint:#16263A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; margin:0; text-wrap:balance; color:var(--text);}
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--primary-tint); }

  /* ---------- App shell ---------- */
  #root{ min-height:100%; }
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:232px; flex:none; background:var(--primary);
    background-image: linear-gradient(180deg, var(--primary) 0%, var(--accent-2) 480%);
    color:#EAF1FC; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    padding-top:env(safe-area-inset-top,0px);
  }
  :root[data-theme="dark"] .sidebar, :root:not([data-theme="light"]) .sidebar{
    background:#0B1220; background-image:none; border-right:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,0.14); }
  .brand img{ width:38px; height:38px; border-radius:8px; object-fit:cover; box-shadow:var(--shadow-sm); }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:var(--font-display); font-size:15px; font-weight:800; letter-spacing:0.01em; }
  .brand-text span{ font-size:10.5px; color:#C7D6EE; letter-spacing:0.03em; text-transform:uppercase; }

  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  .nav-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:#9FB3D4; padding:14px 10px 6px; font-weight:700; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
    color:#D9E4F5; text-decoration:none; cursor:pointer; font-size:13.5px; font-weight:600; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,0.16); color:#fff; box-shadow: inset 3px 0 0 var(--accent); }
  .nav-item .ico{ width:17px; height:17px; flex:none; opacity:0.9; }
  .nav-badge{ margin-left:auto; background:var(--accent); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 7px; }

  .sidebar-foot{ padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,0.14); }
  .demo-pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:0.05em; color:#0B1220; background:#F0C24B; padding:3px 8px; border-radius:20px; text-transform:uppercase; }
  .role-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .role-avatar{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex:none; }
  .role-name{ font-size:12.5px; font-weight:700; color:#fff; }
  .role-tag{ font-size:10.5px; color:#B7C8E5; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:12px 22px; padding-top:calc(12px + env(safe-area-inset-top,0px));
  }
  .topbar h1{ font-size:18px; }
  .topbar .subtitle{ font-size:12.5px; color:var(--text-muted); font-weight:500; margin-top:1px; }
  .search{
    margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:7px 12px; width:280px; max-width:38vw;
  }
  .search input{ border:none; background:none; outline:none; font-size:13px; color:var(--text); width:100%; font-family:inherit; }
  .search svg{ width:15px; height:15px; color:var(--text-faint); flex:none; }

  .content{ flex:1; padding:22px; max-width:1360px; width:100%; margin:0 auto; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); font-size:13px; font-weight:600; padding:8px 14px; cursor:pointer;
    transition:background .12s, border-color .12s; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-hover); }
  .btn svg{ width:14px; height:14px; }
  .btn-primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-2); border-color:var(--primary-2); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-accent:hover{ background:var(--accent-2); border-color:var(--accent-2); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-hover); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-block{ width:100%; justify-content:center; }

  /* ---------- Cards / surfaces ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); }
  .card-pad{ padding:18px; }
  .section-title{ font-size:14.5px; font-weight:700; font-family:var(--font-display); display:flex; align-items:center; gap:8px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .grid{ display:grid; gap:16px; }
  .cols-4{ grid-template-columns:repeat(4,1fr); }
  .cols-3{ grid-template-columns:repeat(3,1fr); }
  .cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:1000px){ .cols-4{grid-template-columns:repeat(2,1fr);} .cols-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .cols-4,.cols-3,.cols-2{grid-template-columns:1fr;} }

  /* ---------- KPI tile ---------- */
  .kpi{ padding:16px; }
  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .kpi-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .kpi-icon svg{ width:16px; height:16px; }
  .kpi-value{ font-family:var(--font-display); font-size:27px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }
  .kpi-sub{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

  /* ---------- Badges / pills ---------- */
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; line-height:1.4; }
  .badge svg{ width:10px; height:10px; }
  .badge-dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .b-info{ background:var(--info-tint); color:var(--info); }
  .b-primary{ background:var(--primary-tint); color:var(--primary); }
  .b-success{ background:var(--success-tint); color:var(--success); }
  .b-warning{ background:var(--warning-tint); color:var(--warning); }
  .b-danger{ background:var(--danger-tint); color:var(--danger); }
  .b-accent{ background:var(--accent-tint); color:var(--accent); }
  .b-neutral{ background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }

  /* ---------- Table ---------- */
  .table-wrap{ overflow-x:auto; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--surface); }
  table{ border-collapse:collapse; width:100%; min-width:860px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); font-weight:700; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:var(--surface-hover); }
  .cell-strong{ font-weight:700; }
  .cell-muted{ color:var(--text-muted); font-size:12.5px; }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--text); }
  th.sortable .arrow{ margin-left:4px; opacity:0.6; }

  /* ---------- Forms ---------- */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .field .hint{ font-size:11px; color:var(--text-faint); font-weight:500; margin-top:-2px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=tel], .field select, .field textarea{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:var(--radius-sm);
    padding:9px 11px; font-size:13.5px; font-family:inherit; outline:none; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }
  .field textarea{ resize:vertical; min-height:90px; line-height:1.5; }
  .checkline{ display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0; cursor:pointer; }
  .checkline input{ width:15px; height:15px; accent-color:var(--primary); flex:none; }
  .check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:560px){ .check-grid{ grid-template-columns:1fr; } }
  .radio-cards{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-card{ border:1.5px solid var(--border-strong); border-radius:var(--radius-sm); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; background:var(--surface); }
  .radio-card.sel{ border-color:var(--primary); background:var(--primary-tint); color:var(--primary); }

  .stepper{ display:flex; align-items:center; gap:0; margin-bottom:22px; }
  .step{ display:flex; align-items:center; gap:9px; color:var(--text-faint); font-weight:700; font-size:12.5px; }
  .step .num{ width:24px; height:24px; border-radius:50%; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:11.5px; }
  .step.active{ color:var(--primary); }
  .step.active .num{ border-color:var(--primary); background:var(--primary); color:#fff; }
  .step.done .num{ border-color:var(--success); background:var(--success); color:#fff; }
  .step.done{ color:var(--success); }
  .step-line{ width:44px; height:2px; background:var(--border-strong); margin:0 8px; }

  /* type picker */
  .type-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:760px){ .type-pick{ grid-template-columns:1fr; } }
  .type-card{ border:1.5px solid var(--border); border-radius:var(--radius-md); padding:18px; cursor:pointer; background:var(--surface); text-align:left; }
  .type-card:hover{ border-color:var(--primary-2); }
  .type-card.sel{ border-color:var(--primary); background:var(--primary-tint); box-shadow:var(--shadow-sm); }
  .type-card .ic{ width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .type-card h4{ font-size:14.5px; margin-bottom:4px; }
  .type-card p{ font-size:12.5px; color:var(--text-muted); line-height:1.45; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto; }
  .tab{ padding:10px 15px; font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; background:none; border-left:none;border-right:none;border-top:none; }
  .tab.active{ color:var(--primary); border-bottom-color:var(--primary); }

  /* ---------- Timeline ---------- */
  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{ content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--border); }
  .tl-item{ position:relative; padding-bottom:20px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{ position:absolute; left:-26px; top:2px; width:17px; height:17px; border-radius:50%; background:var(--surface); border:2.5px solid var(--primary); }
  .tl-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .tl-title{ font-weight:700; font-size:13px; }
  .tl-date{ font-size:11.5px; color:var(--text-faint); }
  .tl-body{ font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.5; }
  .tl-meta{ display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; }
  .tl-meta span{ font-size:11.5px; color:var(--text-faint); }
  .tl-meta b{ color:var(--text-muted); font-weight:600; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(12,16,26,0.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:640px; box-shadow:var(--shadow-md); border:1px solid var(--border); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:16px; }
  .modal-body{ padding:20px 22px; max-height:65vh; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); }
  .icon-btn{ width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; border:none; background:none; cursor:pointer; color:var(--text-muted); }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- Alerts / list rows ---------- */
  .alert-row{ display:flex; align-items:flex-start; gap:11px; padding:11px 4px; border-bottom:1px solid var(--border); }
  .alert-row:last-child{ border-bottom:none; }
  .alert-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .alert-ic svg{ width:15px; height:15px; }
  .alert-title{ font-size:13px; font-weight:700; }
  .alert-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .empty-state{ text-align:center; padding:34px 20px; color:var(--text-faint); }
  .empty-state svg{ width:30px; height:30px; margin-bottom:8px; opacity:0.6; }

  /* filters bar */
  .filters{ display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
  .filters select, .filters input{ border:1px solid var(--border-strong); background:var(--surface); border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; color:var(--text); font-family:inherit; }
  .chip{ display:inline-flex; align-items:center; gap:5px; background:var(--primary-tint); color:var(--primary); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px; }
  .chip button{ background:none; border:none; cursor:pointer; color:inherit; display:flex; padding:0; }
  .chip svg{ width:10px; height:10px; }

  /* endeudamiento priority bar */
  .prio-bar-track{ background:var(--surface-2); border-radius:20px; height:7px; width:100%; overflow:hidden; }
  .prio-bar-fill{ height:100%; border-radius:20px; }

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--text); color:var(--bg); padding:12px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:var(--shadow-md); z-index:80; display:flex; align-items:center; gap:9px; }
  :root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .toast svg{ width:15px; height:15px; color:var(--success); flex:none; }

  .divider{ height:1px; background:var(--border); margin:16px 0; }
  .link-btn{ background:none; border:none; color:var(--primary); font-weight:700; font-size:12.5px; cursor:pointer; padding:0; }
  .muted{ color:var(--text-muted); }
  .small{ font-size:12px; }
  .breadcrumb{ font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .breadcrumb button{ background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;font-size:12.5px;padding:0; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:20px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:840px){
    .sidebar{ position:fixed; z-index:40; transform:translateX(-100%); transition:transform .18s; }
    .sidebar.open{ transform:translateX(0); }
    .menu-toggle{ display:flex !important; }
  }
  .menu-toggle{ display:none; }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useRef} = React;

/* ============================== ICONS ============================== */
const Icon = ({d, children, ...p}) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
    {children}
  </svg>
);
const IcHome = p => <Icon {...p}><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></Icon>;

/* ============================== PRIORIDAD DE ENDEUDAMIENTO ============================== */
function casoStats(caso){
  const montoTotal = (caso.entidadesDeuda||[]).reduce((s,e)=>s+Number(e.monto||0),0);
  const atrasos = (caso.entidadesDeuda||[]).map(e => daysBetween(e.fechaMora, TODAY)).filter(n=>!isNaN(n));
  const atrasoMax = atrasos.length ? Math.max(...atrasos) : 0;
  return {montoTotal, atrasoMax};
}
function computePriorities(casosEndeudamiento, weights){
  const stats = casosEndeudamiento.map(casoStats);
  const maxMonto = Math.max(1, ...stats.map(s=>s.montoTotal));
  const maxAtraso = Math.max(1, ...stats.map(s=>s.atrasoMax));
  return casosEndeudamiento.map((c,i)=>{
    const s = stats[i];
    const nMonto = Math.min(100, (s.montoTotal/maxMonto)*100);
    const nAtraso = Math.min(100, (s.atrasoMax/maxAtraso)*100);
    const score = (nMonto*weights.monto + nAtraso*weights.atraso) / 100;
    let nivel = "baja";
    if(score >= 66) nivel = "alta"; else if(score >= 35) nivel = "media";
    return {...c, _montoTotal:s.montoTotal, _atrasoMax:s.atrasoMax, _score:score, _nivel:nivel, _nMonto:nMonto, _nAtraso:nAtraso};
  }).sort((a,b)=>b._score-a._score);
}

/* ---------- simple bar chart ---------- */
function BarChart({data, valueFmt, color="var(--primary)", height=180}){
  const max = Math.max(1, ...data.map(d=>d.value));
  return (
    <div style={{display:"flex", alignItems:"flex-end", gap:"14px", height:height, padding:"6px 4px 0"}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:"6px", height:"100%", justifyContent:"flex-end"}}>
          <div className="mono" style={{fontSize:"11px", color:"var(--text-muted)", fontWeight:600}}>{valueFmt?valueFmt(d.value):d.value}</div>
          <div title={d.label+": "+d.value} style={{width:"100%", maxWidth:"46px", height:Math.max(4,(d.value/max)*(height-46))+"px", background:d.color||color, borderRadius:"6px 6px 3px 3px"}}></div>
          <div style={{fontSize:"11px", color:"var(--text-faint)", textAlign:"center", lineHeight:1.25, fontWeight:600}}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function Donut({data, size=150}){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let acc = 0;
  const r = 52, c = 2*Math.PI*r;
  return (
    <div style={{display:"flex", alignItems:"center", gap:"18px", flexWrap:"wrap"}}>
      <svg width={size} height={size} viewBox="0 0 130 130">
        <g transform="translate(65,65) rotate(-90)">
          <circle r={r} fill="none" stroke="var(--surface-2)" strokeWidth="18"/>
          {data.map((d,i)=>{
            const frac = d.value/total;
            const dash = frac*c;
            const el = <circle key={i} r={r} fill="none" stroke={d.color} strokeWidth="18" strokeDasharray={dash+" "+(c-dash)} strokeDashoffset={-acc} strokeLinecap="butt"/>;
            acc += dash;
            return el;
          })}
        </g>
        <text x="65" y="61" textAnchor="middle" fontSize="20" fontWeight="800" fill="var(--text)" fontFamily="Libre Franklin">{total}</text>
        <text x="65" y="76" textAnchor="middle" fontSize="9.5" fill="var(--text-faint)" fontFamily="Public Sans">casos</text>
      </svg>
      <div style={{display:"flex", flexDirection:"column", gap:"7px"}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:"flex", alignItems:"center", gap:"7px", fontSize:"12.5px"}}>
            <span style={{width:"9px", height:"9px", borderRadius:"3px", background:d.color, flex:"none"}}></span>
            <span style={{color:"var(--text-muted)", fontWeight:600}}>{d.label}</span>
            <span className="mono" style={{fontWeight:700, marginLeft:"4px"}}>{d.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineChart({data, height=170, color="var(--primary)"}){
  const w = 560;
  const max = Math.max(1, ...data.map(d=>d.value));
  const min = 0;
  const stepX = w/(data.length-1||1);
  const pts = data.map((d,i)=>{
    const x = i*stepX;
    const y = height - ((d.value-min)/(max-min||1))*(height-24) - 6;
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = path + ` L ${pts[pts.length-1][0]},${height} L 0,${height} Z`;
  return (
    <div style={{overflowX:"auto"}}>
      <svg width="100%" viewBox={`0 0 ${w} ${height+26}`} style={{minWidth:"420px"}}>
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[0.25,0.5,0.75].map((f,i)=>(<line key={i} x1="0" x2={w} y1={height*f} y2={height*f} stroke="var(--border)" strokeWidth="1"/>))}
        <path d={area} fill="url(#lg1)" stroke="none"/>
        <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="3.2" fill={color}/>))}
        {data.map((d,i)=>(<text key={i} x={pts[i][0]} y={height+18} textAnchor="middle" fontSize="10.5" fill="var(--text-faint)" fontFamily="Public Sans" fontWeight="600">{d.label}</text>))}
      </svg>
    </div>
  );
}

function useTheme(){
  const [theme,setTheme] = useState(()=>{ try{ return localStorage.getItem("dci_demo_theme")||"system"; }catch(e){ return "system"; } });
  useEffect(()=>{
    if(theme==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    try{ localStorage.setItem("dci_demo_theme", theme); }catch(e){}
  },[theme]);
  return [theme,setTheme];
}

  useEffect(()=>{ saveCasos(casos); },[casos]);
  useEffect(()=>{ try{ localStorage.setItem("dci_demo_weights_v1", JSON.stringify(weights)); }catch(e){} },[weights]);

  function go(view, params){ setRoute({view, ...params}); setMenuOpen(false); window.scrollTo(0,0); }
  function notify(msg){ setToast(msg); }

  function addCaso(caso){
    setCasos(prev => [caso, ...prev]);
  }
  function updateCaso(id, patch){
    setCasos(prev => prev.map(c => c.id===id ? {...c, ...patch} : c));
  }
  function addHistorial(id, entry){
    setCasos(prev => prev.map(c => c.id===id ? {...c, historial:[...c.historial, entry]} : c));
  }

  const endeudCasos = useMemo(()=>casos.filter(c=>c.tipo==="endeudamiento"),[casos]);
  const prioritized = useMemo(()=>computePriorities(endeudCasos, weights),[endeudCasos, weights]);

  const casoActual = route.id ? casos.find(c=>c.id===route.id) : null;

  const navItems = [
    {key:"dashboard", label:"Inicio", icon:<IcHome/>},
    {key:"list", label:"Bandeja de casos", icon:<IcFolder/>},
    {key:"endeudamiento", label:"Endeudamiento", icon:<IcCoin/>, badge: endeudCasos.filter(c=>c.estadoOperativo==="en_gestion").length},
    {key:"stats", label:"Estadísticas", icon:<IcChart/>},
  ];

/* ============================== DASHBOARD ============================== */
function Dashboard({casos, prioritized, go}){
  const enGestion = casos.filter(c=>c.estadoOperativo==="en_gestion");
  const acuerdoExitoso = casos.filter(c=>c.resultadoAcuerdo==="acuerdo_vigente");
  const finalizados = casos.filter(c=>c.resultadoAcuerdo==="acuerdo_cumplido");
  const incumplidos = casos.filter(c=>c.resultadoAcuerdo==="incumplido_denunciante"||c.resultadoAcuerdo==="incumplido_denunciado");

  const olvidados = enGestion.map(c=>{
    const ultimaFecha = c.historial.length ? c.historial[c.historial.length-1].fecha.slice(0,10) : c.fechaIngreso;
    return {...c, diasSinMovimiento: daysBetween(ultimaFecha, TODAY)};
  }).filter(c=>c.diasSinMovimiento >= 20).sort((a,b)=>b.diasSinMovimiento-a.diasSinMovimiento);

  const proximas = [];
  casos.forEach(c=>{
    (c.historial||[]).forEach(h=>{
      if(h.fechaProximaAccion){
        const dias = daysBetween(TODAY, h.fechaProximaAccion);
        if(dias >= -3 && dias <= 10){
          proximas.push({casoId:c.id, caso:c, proximaAccion:h.proximaAccion, fecha:h.fechaProximaAccion, dias});
        }
      }
    });
  });
  const proximasUnicas = Object.values(proximas.reduce((acc,p)=>{ acc[p.casoId] = p; return acc; },{})).sort((a,b)=>a.dias-b.dias);

  const actividad = [];
  casos.forEach(c=>{ (c.historial||[]).forEach(h=> actividad.push({...h, casoId:c.id, tipo:c.tipo})); });
  actividad.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  const actividadReciente = actividad.slice(0,6);

  const topEndeudamiento = prioritized.filter(c=>c.estadoOperativo==="en_gestion").slice(0,5);

  return (
